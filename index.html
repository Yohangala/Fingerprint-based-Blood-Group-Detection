<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingerprint Blood Group Classifier</title>
    <style>
        /* Base Colors */
        :root {
            --primary-color: #10b981; /* Emerald Green */
            --secondary-bg: #f3f4f6; /* Light Gray */
            --white: #ffffff;
            --text-dark: #1f2937; /* Gray 800 */
            --text-medium: #6b7280; /* Gray 600 */
            --red-text: #dc2626;
            --red-bg: #fee2e2;
            --green-text: #059669;
            --green-bg: #d1fae5;
            --yellow-text: #d97706;
            --yellow-bg: #fef3c7;
        }

        /* Font & Layout */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--secondary-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--white);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 2rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Header */
        header {
            text-align: center;
        }
        header h1 {
            font-size: 1.875rem; /* 3xl */
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }
        header p {
            color: var(--text-medium);
        }

        /* Form Styling */
        #upload-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* File Input Styling (Custom Look) */
        .file-input-container {
            border: 1px solid #d1d5db; /* Gray 300 */
            border-radius: 8px;
            padding: 10px;
            display: block;
            background-color: #f9fafb; /* Gray 50 */
            transition: border-color 0.2s;
        }
        .file-input-container:hover {
            border-color: var(--primary-color);
        }

        #fingerprint-file {
            width: 100%;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-medium);
        }

        /* Submit Button */
        #submit-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--white);
            background-color: var(--primary-color);
            transition: background-color 0.2s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
        }
        #submit-btn:hover:not(:disabled) {
            background-color: #059669; /* Emerald 600 */
        }
        #submit-btn:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.5); /* Ring focus */
        }
        #submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Image Preview */
        #image-preview-container {
            margin-top: 1rem;
        }
        #image-preview {
            width: 100%;
            height: 192px; /* h-48 */
            object-fit: contain;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 8px;
        }

        /* Status and Result Display */
        #result-container {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #status-message {
            padding: 0.75rem;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
        }
        
        .status-default {
            color: var(--text-dark);
            background-color: var(--secondary-bg);
        }
        .status-success {
            color: var(--green-text);
            background-color: var(--green-bg);
        }
        .status-error {
            color: var(--red-text);
            background-color: var(--red-bg);
        }
        .status-loading {
            color: var(--yellow-text);
            background-color: var(--yellow-bg);
        }

        #prediction-result {
            padding: 1.5rem;
            border: 4px solid var(--primary-color);
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        #predicted-class {
            font-size: 3.75rem; /* 6xl */
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 0.5rem;
        }

        #confidence-score {
            font-size: 1.125rem;
            color: var(--text-medium);
            margin-top: 0.5rem;
        }

        /* Utility for Hidden Elements */
        .hidden {
            display: none !important;
        }

        /* Spinner Animation (Minimal SVG setup) */
        #loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <h1>Blood Group Classifier</h1>
            <p>Upload a fingerprint image to predict the blood group (ResNet152 Model)</p>
        </header>

        <form id="upload-form">
            <div>
                <label for="fingerprint-file" style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">Select Fingerprint Image:</label>
                <div class="file-input-container">
                    <input type="file" id="fingerprint-file" name="file" accept="image/*" required>
                </div>
            </div>

            <div id="image-preview-container" class="hidden">
                <img id="image-preview" alt="Image Preview">
            </div>

            <button type="submit" id="submit-btn">
                <svg id="loading-spinner" class="hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="height: 20px; width: 20px;">
                    <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Classify Blood Group
            </button>
        </form>

        <div id="result-container">
            <div id="status-message" class="status-default">
                Upload an image and click 'Classify' to begin.
            </div>

            <div id="prediction-result" class="hidden">
                <p style="font-size: 1.25rem; font-weight: 700; color: #1f2937;">Predicted Blood Group:</p>
                <p id="predicted-class">--</p>
                <p id="confidence-score">Confidence: --</p>
            </div>
        </div>

    </div>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('fingerprint-file');
        const submitBtn = document.getElementById('submit-btn');
        const loadingSpinner = document.getElementById('loading-spinner');
        const statusMessage = document.getElementById('status-message');
        const resultContainer = document.getElementById('prediction-result');
        const predictedClass = document.getElementById('predicted-class');
        const confidenceScore = document.getElementById('confidence-score');
        const imagePreview = document.getElementById('image-preview');
        const previewContainer = document.getElementById('image-preview-container');

        // --- Helper Functions ---

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            submitBtn.style.opacity = isLoading ? '0.6' : '1';
            submitBtn.style.cursor = isLoading ? 'not-allowed' : 'pointer';

            statusMessage.classList.remove('status-success', 'status-error', 'status-default', 'status-loading');
            
            if (isLoading) {
                loadingSpinner.classList.remove('hidden');
                statusMessage.textContent = "Processing image and running prediction...";
                statusMessage.classList.add('status-loading');
            } else {
                loadingSpinner.classList.add('hidden');
            }
        }

        function showResult(data) {
            predictedClass.textContent = data.prediction;
            confidenceScore.textContent = `Confidence: ${data.confidence}%`;
            resultContainer.classList.remove('hidden');
            statusMessage.textContent = data.message;
            statusMessage.classList.remove('status-loading');
            statusMessage.classList.add('status-success');
        }

        function showError(message) {
            resultContainer.classList.add('hidden');
            statusMessage.textContent = `Error: ${message}`;
            statusMessage.classList.remove('status-loading');
            statusMessage.classList.add('status-error');
        }

        // --- Event Listeners ---

        // 1. Image Preview
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                imagePreview.src = '#';
                previewContainer.classList.add('hidden');
            }
        });

        // 2. Form Submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const file = fileInput.files[0];

            if (!file) {
                showError("Please select a fingerprint image to upload.");
                return;
            }

            setLoading(true);

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Flask endpoint is /predict
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showResult(data);
                } else {
                    showError(data.error || "An unknown error occurred during prediction.");
                }

            } catch (error) {
                console.error('Fetch error:', error);
                showError("Could not connect to the server or process the request.");
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
